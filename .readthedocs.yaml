version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  commands:
    - asdf plugin add uv
    - asdf install uv latest
    - asdf global uv latest
    - uv sync --group dev
    - uv run sphinx-build -b html docs/ $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py

python:
  install: []

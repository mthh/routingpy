name: Documentation

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Allow the workflow to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do not cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # needed for gh pages workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.14"
          enable-cache: true

      # mkdocstrings imports routingpy to introspect it, so the project itself
      # must be installed alongside the docs group.
      - name: Install docs dependencies
        run: uv sync --no-default-groups --group docs

      - name: Build site
        run: uv run zensical build -f docs/zensical.toml

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

      - uses: actions/deploy-pages@v5
        id: deployment
